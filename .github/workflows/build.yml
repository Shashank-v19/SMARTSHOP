name: Build & Verify SMARTSHOP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven (skip tests)
        run: mvn clean package -DskipTests

      - name: ✅ Verify WAR was created
        run: |
          echo "=== Build Output ==="
          ls -lh target/*.war
          echo "✅ smartshop.war built successfully!"

      - name: 📦 Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartshop-war
          path: target/smartshop.war
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t smartshop:latest .
          echo "✅ Docker image built successfully!"

      - name: 🔍 Inspect Docker image
        run: docker images smartshop
